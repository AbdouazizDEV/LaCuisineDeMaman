<div class="day-filter-chips" role="tablist" aria-label="Filtres menu du jour">
  @for (option of options; track option.id) {
    <app-filter-chip
      [label]="option.label"
      [active]="option.id === activeFilterId"
      [ariaLabel]="'Filtrer sur ' + option.label"
      (selected)="filterChange.emit(option.id)"
    />
  }
</div>
