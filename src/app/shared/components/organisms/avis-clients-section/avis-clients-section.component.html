<section class="avis-section" aria-labelledby="avis-clients-title">
  <h2 id="avis-clients-title" class="avis-section__title">
    <span>AVIS</span> <span class="avis-section__title-accent">CLIENTS</span>
  </h2>

  <div class="avis-section__carousel">
    <button
      type="button"
      class="avis-section__nav-btn"
      aria-label="Avis précédent"
      (click)="previous()"
    >
      ‹
    </button>

    @if (activeReview; as review) {
      <article class="avis-section__card">
        <div class="avis-section__head">
          <div class="avis-section__author">
            <img
              class="avis-section__avatar"
              [src]="review.authorAvatarUrl"
              [alt]="review.authorName"
              width="40"
              height="40"
              appImgFallback
            />
            <span class="avis-section__name">{{ review.authorName }}</span>
          </div>
          <div class="avis-section__rating" aria-label="Note client">
            @for (star of [1, 2, 3, 4, 5]; track star) {
              <span class="avis-section__star" [class.filled]="star <= review.rating">★</span>
            }
          </div>
        </div>

        <p class="avis-section__text">{{ review.comment }}</p>
        <hr class="avis-section__line" />
      </article>
    }

    <button
      type="button"
      class="avis-section__nav-btn"
      aria-label="Avis suivant"
      (click)="next()"
    >
      ›
    </button>
  </div>
</section>
