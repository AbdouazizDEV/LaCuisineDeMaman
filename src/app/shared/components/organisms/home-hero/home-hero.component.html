<section class="home-hero" aria-labelledby="home-hero-title">
  <h1 id="home-hero-title" class="home-hero__title">
    Une bonne cuisinière sème
    <span class="home-hero__title-highlight">le bonheur</span>
  </h1>
  <div class="home-hero__visual" aria-hidden="true">
    <img
      class="home-hero__dots"
      [src]="dotsImageSrc"
      alt=""
      width="59"
      height="215"
      appImgFallback
    />
    <img
      class="home-hero__chef"
      [src]="chefImageSrc"
      alt=""
      width="240"
      height="308"
      appImgFallback
    />
    <img
      class="home-hero__mask"
      [src]="maskImageSrc"
      alt=""
      width="390"
      height="110"
      appImgFallback
    />
  </div>
</section>
